<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body onload="getMeals()">

    <div class="container-fluid">
        <div class="row" id="target">
           
        </div>
    </div>


    <script>
        var target = document.getElementById('target');
        var url = 'recipes.json'; // Path to your local JSON file

        async function getMeals() {
            try {
                // Fetch data from the local JSON file
                const response = await fetch(url);
                const body = await response.json();

                // List of recipes from the JSON file
                const list = body.recipes;

                // Loop through the recipes and generate cards
                for (var i = 0; i < list.length; i++) {
                    var card = document.createElement('div');
                    card.classList.add('col-lg-3', 'col-md-4', 'col-sm-10', 'col-xs-12');

                    card.innerHTML = `
                      <div class="card m-auto">
                            <div class="card-header">
                                <img src="${list[i].image}" class="img-fluid" width="350px" height="300px" style="margin:0px 30px 0px 0px;">
                            </div>
                            <div class="card-body">
                                <h5>Name</h5>: <span>${list[i].name}</span>
                                <h5>Price</h5>: <span>${list[i].price}</span>

                                <a href="item.html?id=${list[i].id}" class="btn btn-primary">Click</a>
                            </div>
                        </div>
                    `;
                    target.appendChild(card);
                }
            } catch (error) {
                console.error('Error loading recipes:', error);
                target.innerHTML = `
                    <div class="alert alert-danger text-center">
                        Failed to load recipes. Please try again later.
                    </div>
                `;
            }
        }
    </script>
    
</body>
</html>
