<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body onload="loadData()">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 mx-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#"><b>Food Recipes</b></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row" id="target">
        </div>
    </div>

    <script>
        const target = document.getElementById('target');
        const url = 'recipes.json'; 

        async function loadData() {
            try {
                const response = await fetch(url); 
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json(); 
                const list = data.recipes; 

                list.forEach(recipe => {
                    const card = document.createElement('div');
                    card.classList.add('col-lg-3', 'col-md-4', 'col-sm-10', 'col-xs-12');
                    card.innerHTML = `
                        <div class="card m-auto" style="transform:scale(0.9)">
                            <div class="card-header">
                                <img src="${recipe.image}" class="image-fluid" width="300px" height="300px" class="m-2" alt="${recipe.name}">
                            </div>
                            <div class="card-body">
                                <div><span><b>Item name:</b> ${recipe.name}</span></div>
                                <div><span><b>Difficulty:</b> ${recipe.difficulty}</span></div>
                                <div><span><b>Rating:</b> ${recipe.rating}/5</span></div>
                                <div><span><b>Cuisine:</b> ${recipe.cuisine}</span></div>
                                <a class="btn btn-primary btn-rounded" href="item.html?id=${recipe.id}">More</a>
                            </div>
                        </div>
                    `;
                    target.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading JSON data:', error);
            }
        }
    </script>
</body>
</html>
